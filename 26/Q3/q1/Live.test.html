<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Live.test</title>
<style>

* { margin: 0; padding: 0; box-sizing: border-box; line-height: 1; }

html
{
	height: 100%; overflow: hidden;
	font-size: calc( 5px + clamp( 0px, 2vw, 10px ) );
	font-family: sans-serif;
	color: hsl( 0, 0%, 16% );
}

body
{
	height: 100%; overflow: auto;
	padding: 30px 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 1rem;
}

/* ── ヘッダー ── */

.path ul
{
	padding: 0 0.5ex; line-height: 1.4;
	display: flex; align-items: center; gap: 0.5ex;
}
.path .sep { font-size: 76%; color: hsl( 50, 15%, 65% ); }
a { color: hsl( 0, 0%, 20% ); text-decoration: none; }
a:hover { color: hsl( 205, 70%, 50% ); }

h1
{
	margin-bottom: 0.5rem;
	background: hsl( 225, 65%, 55% ); color: hsl( 0, 0%, 100% );
	min-width: 12em; padding: 0.4ex 1ex 0.2ex; text-align: center;
}

/* ── サマリーバー ── */

#summary
{
	min-width: 28em;
	padding: 0.6ex 1.2ex;
	border-radius: 3px;
	font-family: 'Courier New', Courier, monospace;
	font-size: 1.1em;
	background: hsl( 50, 5%, 90% );
	display: flex; align-items: center; gap: 1ex;
}
#summary.all-pass { background: hsl( 140, 55%, 88% ); color: hsl( 140, 50%, 22% ); }
#summary.has-fail { background: hsl(   0, 60%, 90% ); color: hsl(   0, 55%, 28% ); }

/* ── セクション ── */

.section
{
	min-width: 28em; width: clamp( 28em, 70vw, 64em );
}

.section-title
{
	padding: 0.3ex 0.8ex;
	background: hsl( 220, 20%, 88% );
	font-weight: bold; font-size: 0.95em;
	border-left: 3px solid hsl( 225, 55%, 55% );
}

/* ── テスト行 ── */

table.cases
{
	width: 100%; border-collapse: collapse;
	font-family: 'Courier New', Courier, monospace;
	font-size: 0.92em;
}
table.cases td
{
	padding: 0.25ex 0.7ex;
	border-bottom: 1px dotted hsl( 50, 5%, 78% );
}
.icon  { width: 2em; text-align: center; }

tr.pass .icon { color: hsl( 140, 55%, 36% ); }
tr.fail .icon { color: hsl(   0, 65%, 48% ); }
tr.pass { background: hsl( 140, 50%, 97% ); }
tr.fail { background: hsl(   0, 55%, 96% ); }

</style>
</head>
<body>

<div class="path">
	<ul>
		<a href="../../../../zz-index.html">Root</a>
		<span class="sep">&gt;</span><a href="../../../zz-index.html">Claude</a>
		<span class="sep">&gt;</span><a href="../../zz-index.html">26</a>
		<span class="sep">&gt;</span><a href="../zz-index.html">Q3</a>
		<span class="sep">&gt;</span><a href="./zz-index.html">q1</a>
	</ul>
</div>

<h1>Live.test</h1>

<div id="summary">実行中…</div>
<div id="output"></div>

<script type="module">

import { Live }   from "../js-out/Meh/Model/Live.js" ;
import { lf_sub , lf_unsub , lf_term , lf_agg , lv_get , lv_set , agg_echan }
	from "../js-out/Meh/Model/symbols.js" ;

// ─── ユーティリティ ───────────────────────────────────────────────────────────

const output  = document.getElementById ( "output" ) ;
const summary = document.getElementById ( "summary" ) ;

let totalPass = 0 ;
let totalFail = 0 ;
let currentTbody = null ;

function section ( title )
{
	const wrap = document.createElement ( "div" ) ;
	wrap.className = "section" ;

	const hd = document.createElement ( "div" ) ;
	hd.className = "section-title" ;
	hd.textContent = title ;
	wrap.appendChild ( hd ) ;

	const tbl = document.createElement ( "table" ) ;
	tbl.className = "cases" ;
	const tbody = document.createElement ( "tbody" ) ;
	tbl.appendChild ( tbody ) ;
	wrap.appendChild ( tbl ) ;

	output.appendChild ( wrap ) ;
	currentTbody = tbody ;
}

function assert ( label , cond )
{
	const tr = document.createElement ( "tr" ) ;
	tr.className = cond ? "pass" : "fail" ;

	const tdIcon = document.createElement ( "td" ) ;
	tdIcon.className = "icon" ;
	tdIcon.textContent = cond ? "✅" : "❌" ;

	const tdLabel = document.createElement ( "td" ) ;
	tdLabel.textContent = label ;

	tr.appendChild ( tdIcon ) ;
	tr.appendChild ( tdLabel ) ;
	currentTbody.appendChild ( tr ) ;

	if ( cond ) totalPass ++ ; else totalFail ++ ;
}

function makeRef ()
{
	return {
		values      : [] ,
		unsubCalled : false ,
		vchan ( v ) { this.values.push ( v ) ; } ,
		unsub ()    { this.unsubCalled = true ; } ,
	} ;
}

function makeAgg ()
{
	return {
		count : 0 ,
		[ agg_echan ] () { this.count ++ ; } ,
	} ;
}

// ─── 1. Leaf 初期値 ───────────────────────────────────────────────────────────

section ( "1. Live.Leaf 初期値" ) ;

const lf1 = new Live.Leaf ( 42 ) ;
assert ( "lv_get() で初期値を取得できる"       , lf1 [ lv_get ] () === 42 ) ;
assert ( "Live.get() でも初期値を取得できる"   , Live.get ( lf1 )  === 42 ) ;

const lf2 = new Live.Leaf ( "hello" ) ;
assert ( "文字列型の初期値を取得できる"        , Live.get ( lf2 ) === "hello" ) ;

const lf3 = new Live.Leaf ( null ) ;
assert ( "null を初期値にできる"               , Live.get ( lf3 ) === null ) ;

// ─── 2. Live.create ───────────────────────────────────────────────────────────

section ( "2. Live.create() ファクトリ" ) ;

const lc1 = Live.create ( 10 ) ;
assert ( "Live.create() で Live インスタンスを生成できる"   , lc1 instanceof Live ) ;
assert ( "Live.create() の初期値が正しい"                  , Live.get ( lc1 ) === 10 ) ;

// ─── 3. lf_sub : 登録直後の即時通知 ──────────────────────────────────────────

section ( "3. lf_sub : 登録直後の即時通知" ) ;

const lf4  = new Live.Leaf ( 10 ) ;
const ref1 = makeRef () ;
lf4 [ lf_sub ] ( ref1 ) ;

assert ( "sub 直後に vchan が 1 回呼ばれる"         , ref1.values.length === 1 ) ;
assert ( "sub 直後の vchan 値が現在値と一致する"    , ref1.values [ 0 ] === 10 ) ;
assert ( "sub 直後は unsub が呼ばれていない"        , ! ref1.unsubCalled ) ;

// ─── 4. lv_set : 値変更と通知 ────────────────────────────────────────────────

section ( "4. lv_set : 値変更と Ref への通知" ) ;

lf4 [ lv_set ] ( 20 ) ;
assert ( "set 後に vchan が追加で呼ばれる"          , ref1.values.length === 2 ) ;
assert ( "set 後の vchan 値が新しい値と一致する"    , ref1.values [ 1 ] === 20 ) ;
assert ( "lv_get() が新しい値を返す"                , lf4 [ lv_get ] () === 20 ) ;
assert ( "Live.get() も新しい値を返す"              , Live.get ( lf4 )  === 20 ) ;

// ─── 5. 同値再セット ──────────────────────────────────────────────────────────

section ( "5. 同値再セットは通知しない（Leaf の最適化）" ) ;

const before = ref1.values.length ;
lf4 [ lv_set ] ( 20 ) ;
assert ( "同値の set では vchan が増えない"         , ref1.values.length === before ) ;

// ─── 6. Live.set ヘルパー ────────────────────────────────────────────────────

section ( "6. Live.set ヘルパー" ) ;

Live.set ( lf4 , 99 ) ;
assert ( "Live.set() で値が変更される"              , Live.get ( lf4 ) === 99 ) ;
assert ( "Live.set() 後に vchan が呼ばれる"         , ref1.values [ ref1.values.length - 1 ] === 99 ) ;

// ─── 7. 複数 Ref ──────────────────────────────────────────────────────────────

section ( "7. 複数 Ref への同時通知" ) ;

const lf5  = new Live.Leaf ( "a" ) ;
const refA = makeRef () ;
const refB = makeRef () ;
lf5 [ lf_sub ] ( refA ) ;
lf5 [ lf_sub ] ( refB ) ;
lf5 [ lv_set ] ( "b" ) ;
assert ( "refA に値変更が通知される"                , refA.values.includes ( "b" ) ) ;
assert ( "refB に値変更が通知される"                , refB.values.includes ( "b" ) ) ;

// ─── 8. lf_unsub ─────────────────────────────────────────────────────────────

section ( "8. lf_unsub : Ref の解除" ) ;

lf5 [ lf_unsub ] ( refA ) ;
assert ( "unsub で ref.unsub() が呼ばれる"          , refA.unsubCalled ) ;

const lenBefore = refA.values.length ;
lf5 [ lv_set ] ( "c" ) ;
assert ( "unsub 後は解除された ref に通知されない"  , refA.values.length === lenBefore ) ;
assert ( "unsub されていない refB には通知が届く"   , refB.values.includes ( "c" ) ) ;

// ─── 9. lf_term ──────────────────────────────────────────────────────────────

section ( "9. lf_term : 全 Ref への終了通知" ) ;

const lf6  = new Live.Leaf ( 0 ) ;
const refC = makeRef () ;
const refD = makeRef () ;
lf6 [ lf_sub ] ( refC ) ;
lf6 [ lf_sub ] ( refD ) ;
lf6 [ lf_term ] () ;
assert ( "term で refC.unsub() が呼ばれる"          , refC.unsubCalled ) ;
assert ( "term で refD.unsub() が呼ばれる"          , refD.unsubCalled ) ;

let threwAfterTerm = false ;
try { lf6 [ lv_set ] ( 999 ) ; } catch { threwAfterTerm = true ; }
assert ( "term 後に lv_set しても例外が出ない"      , ! threwAfterTerm ) ;

// ─── 10. Agg 連携 — コンストラクタ渡し ───────────────────────────────────────

section ( "10. Agg 連携 — Leaf コンストラクタで agg を渡す" ) ;

const agg1 = makeAgg () ;
const lf7  = new Live.Leaf ( 1 , agg1 ) ;

lf7 [ lv_set ] ( 2 , agg1 ) ;
assert ( "コンストラクタ渡し agg で agg_echan が呼ばれる"     , agg1.count === 1 ) ;

lf7 [ lv_set ] ( 3 , agg1 ) ;
assert ( "set のたびに agg_echan が呼ばれる"                  , agg1.count === 2 ) ;

const otherAgg = makeAgg () ;
lf7 [ lv_set ] ( 4 , otherAgg ) ;
assert ( "異なる agg では agg_echan が呼ばれない"             , agg1.count === 2 ) ;

// ─── 11. Agg 連携 — lf_agg 直接セット ────────────────────────────────────────

section ( "11. Agg 連携 — lf_agg を直接セット" ) ;

const agg2 = makeAgg () ;
const lf8  = new Live.Leaf ( 0 ) ;
lf8 [ lf_agg ] = agg2 ;
lf8 [ lv_set ] ( 5 , agg2 ) ;
assert ( "lf_agg 直接セットで agg_echan が呼ばれる"           , agg2.count === 1 ) ;

// ─── 12. unsub 未定義 Ref ─────────────────────────────────────────────────────

section ( "12. unsub 未定義の Ref" ) ;

const lf9        = new Live.Leaf ( false ) ;
const refNoUnsub = { vchan () {} } ;
lf9 [ lf_sub ] ( refNoUnsub ) ;

let threwNoUnsub = false ;
try { lf9 [ lf_term ] () ; } catch { threwNoUnsub = true ; }
assert ( "unsub 未定義の Ref を term しても例外が出ない"       , ! threwNoUnsub ) ;

// ─── サマリー更新 ─────────────────────────────────────────────────────────────

const allPass = totalFail === 0 ;
summary.textContent = allPass
	? `✅  全 ${ totalPass } 件 PASS`
	: `❌  ${ totalPass } PASS  /  ${ totalFail } FAIL` ;
summary.className = allPass ? "all-pass" : "has-fail" ;

</script>
</body>
</html>
